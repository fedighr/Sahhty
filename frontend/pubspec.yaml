name: sahhty
description: Sahhty - Intelligent Health Tracking Application for Tunisia
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP Client
  dio: ^5.4.3+1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Navigation
  go_router: ^13.2.4

  # UI
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  intl: 0.20.2

  # Utils
  equatable: ^2.0.5
  logger: ^2.3.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.9
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
