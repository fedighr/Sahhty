name: sahhty
description: Sahhty — Tunisian health tracking app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.1

  # HTTP
  dio: ^5.7.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Utilities
  equatable: ^2.0.5
  intl: ^0.20.2

  # Animations
  flutter_animate: ^4.5.0

  # Logging
  logger: ^2.4.0

  # Fonts
  google_fonts: ^6.2.1

  # Health Connect (smartwatch)
  health: ^13.3.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

